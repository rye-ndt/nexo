# Application configuration. Fields go here as Config grows.
app:
  name: Nexo
  # Storage key for every on-disk path. Renaming `name` is cosmetic; renaming
  # this orphans the database, the installed harnesses and the user config.
  data_dir: nexo
  w: 1024
  h: 768
  bg: "#1B2636"
version: 1.0.0
log_level: info # debug | info | warn | error

workflow:
  heartbeat_timeout: 30m
  heartbeat_scan_interval: 1m
  agent_heartbeat_interval: 1m

approval_broker:
  timeout: 30m

agent_manager:
  freeze_timeout: 5m
  allowed_agent_context_window: 200000
  connectivity_probe_url: https://api.anthropic.com
  connectivity_cache_ttl: 15s

mcp_servers:
  auth_timeout: 5m
  client_name: nexo
  callback_path: /callback
  shutdown_grace: 2s
  verifier_bytes: 32 # must be >= the rfc 7636 floor in helpers/constances
  state_bytes: 16
  default_token_ttl: 1h
  challenge_method: S256 # the only method implemented; anything else is rejected at startup
  chrome:
    debug_port: 9222
    profile_dir: chrome
    launch_timeout: 30s
    call_timeout: 30s
    max_page_chars: 40000
  control:
    enabled: true
    endpoint_file: control.json
    allow_any_workspace: true
    allowed_roots: []
    max_steps_per_workflow: 32
    max_workflows_listed: 20
    autostart_default: false
  supported_servers:
    atlassian:
      name: atlassian
      url: https://mcp.atlassian.com/v1/mcp/authv2
      auth_key_name: ATLASSIAN_OAUTH_SECRET
      auth_flow: dcr
      account: # display only; a failed lookup leaves the account blank
        url: https://api.atlassian.com/me
        header: Authorization
        scheme: Bearer
        fields: [email, name, account_id]
    github:
      name: github
      url: https://api.githubcopilot.com/mcp/
      auth_key_name: GITHUB_OAUTH_SECRET
      auth_flow: device
      client_id: Ov23lihq27C9yT8Flsk3
      device_auth_url: https://github.com/login/device/code
      token_ttl: 8760h
      account:
        url: https://api.github.com/user
        header: Authorization
        scheme: Bearer
        fields: [login, name]
    figma: # edge case
      name: figma
      auth_key_name: figma
      auth_flow: token
      client_id: ""
      url: https://api.figma.com
      token_ttl: 8760h
      account:
        url: https://api.figma.com/v1/me
        header: X-Figma-Token
        fields: [email, handle]
    chrome-devtools: # local: no credential, the operator switches it on
      name: chrome-devtools
      auth_key_name: ""
      auth_flow: enable
      client_id: ""
      url: http://127.0.0.1:9222
  encode_key: sk-abcxyz

agent_harness:
  claude_code:
    name: Claude Code
    bin_name: claude_code
    release_base: https://downloads.claude.ai/claude-code-releases
    login_timeout: 5m
    token_regex: sk-ant-oat[0-9]{2}-[A-Za-z0-9_-]{20,}
    ansi_regex: \x1b\[[0-9;?]*[a-zA-Z]
    max_instance: 3
    enabled_models:
      - fable
      - opus
      - sonnet
      - haiku

  open_code:
    name: Open Code
    bin_name: opencode
    release_base: https://api.github.com/repos/anomalyco/opencode
    login_timeout: 5m
    max_instance: 3
    enabled_models:
      - opencode/deepseek-v4-flash-free

  codex:
    name: Codex
    bin_name: codex
    release_base: https://api.github.com/repos/openai/codex
    login_timeout: 5m
    max_instance: 3
    enabled_models:
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-5.6-luna
